name: Platform CI

# specimens/** too: e2e seeds R2 from it and checks it against seed.sql, and an
# Embody save re-exports it in commits that touch no platform/ file (field
# 2026-09-11). Drift must fail on the commit that makes it, not a later PR.
on:
  push:
    paths:
      - 'platform/**'
      - 'specimens/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - 'specimens/**'
      - '.github/workflows/platform-ci.yml'
  # By hand: re-run the production specimen sync (job sync-specimens) without a
  # push. dry_run (the default) puts the blobs and prints the plan, writes no rows.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only: upload blobs and report, do not write D1 rows'
        type: boolean
        default: true

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro requires Node >=22.12.0 (astro check/build abort on Node 20).
          node-version: '22'
          # Cache npm downloads keyed off the platform-root lockfile.
          cache: npm
          cache-dependency-path: platform/package-lock.json

      # Installs every workspace (apps/web + packages/*) from the root lockfile.
      - name: Install dependencies
        run: npm ci

      # Typecheck the Astro app (astro check). Runs against the web workspace.
      - name: Typecheck (astro check)
        run: npm run typecheck --workspace=@embody/web

      # Production build of the Astro + Cloudflare worker app.
      - name: Build (astro build)
        run: npm run build --workspace=@embody/web

      # Scanner unit tests (vitest run).
      - name: Test scanner-ts
        run: npm run test --workspace=@embody/scanner-ts

  # ---------------------------------------------------------------------------
  # Playwright e2e against `astro dev` on local miniflare D1/R2 -- the only job
  # that runs Better Auth against a real D1. A green typecheck + build shipped a
  # 500 on every /api/auth/* for ~23h (field 2026-09-11); deploy now needs this
  # job, so a dependency bump that breaks auth (or any e2e flow) never ships.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: platform/apps/web
    env:
      E2E_PORT: '4321'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      # Browsers are cached per Playwright version. The apt packages are not,
      # so a cache hit still installs the system deps.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # .dev.vars is gitignored. ENVIRONMENT=development turns off Turnstile,
      # both rate limiters and Secure-only cookies (plain http here). The auth
      # secret is random per run and never printed.
      - name: Write .dev.vars
        run: |
          umask 077
          printf 'ENVIRONMENT=development\nBETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > .dev.vars

      # --local needs no Cloudflare login; under CI wrangler auto-confirms.
      - name: Apply D1 migrations (local)
        run: npx wrangler d1 migrations apply embody --local

      # global.setup.ts reseeds D1 only. The collection and viewer specs also
      # need every R2 object seed.sql points at in local R2: each .tdxn keyed by
      # its sha256 (tdn_r2_key) and each cover under thumbnails/<sha256>
      # (thumbnail_key, served by /api/specimens/:slug/thumbnail). Hashes the
      # files in specimens/ itself, so a stale committed manifest cannot pass.
      - name: Seed local R2 with specimen blobs
        run: |
          listed="$(node -e 'console.log(require("../../../specimens/manifest.json").specimens.length)')"
          staged="$(node -e 'console.log(require("./scripts/.seed-blobs.manifest.json").filter(e => e.kind === "tdxn").length)')"
          if [ "$listed" -eq 0 ] || [ "$listed" != "$staged" ]; then
            echo "::error::specimens/manifest.json lists $listed specimens but scripts/.seed-blobs.manifest.json stages $staged. Rerun scripts/build-specimen-data.py and commit."
            exit 1
          fi
          count=0
          while IFS=$'\t' read -r slug key sha ctype rel; do
            f="../../../$rel"
            got="$(sha256sum "$f" | cut -d' ' -f1)"
            if [ "$got" != "$sha" ] || ! grep -q "'$key'" src/server/seed.sql; then
              echo "::error::$rel hashes to $got; the committed seed data says $sha under '$key' ($slug). Rerun scripts/build-specimen-data.py and commit."
              exit 1
            fi
            npx wrangler r2 object put "embody-blobs/$key" --file="$f" --content-type "$ctype" --local < /dev/null
            count=$((count + 1))
          done < <(node -e 'for (const e of require("./scripts/.seed-blobs.manifest.json")) console.log([e.slug, e.key, e.sha256, e.content_type, e.path].join("\t"))')
          echo "seeded $count specimen blobs (networks + covers)"

      # A cold node_modules/.vite can kill the first `astro dev` boot: the SSR
      # optimizer finds a late dep, reloads, and workerd imports a chunk that was
      # just replaced (field 2026-09-11). Boot until the auth + collection pages
      # serve, retrying, so Playwright's own webServer starts on a warm cache.
      - name: Warm the Vite dep cache
        timeout-minutes: 12
        env:
          ASTRO_DEV_BACKGROUND: '1'
        run: |
          base="http://127.0.0.1:$E2E_PORT"
          log="$RUNNER_TEMP/astro-warm.log"
          serves() {
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$base$1" || true)"
            [ "$code" -ge 200 ] && [ "$code" -lt 500 ]
          }
          for attempt in 1 2 3; do
            ../../node_modules/.bin/astro dev --port "$E2E_PORT" --host 127.0.0.1 > "$log" 2>&1 &
            pid=$!
            ok=0
            for _ in $(seq 1 60); do
              kill -0 "$pid" 2>/dev/null || break
              if serves /; then
                ok=1
                for path in /signin /forgot-password /collection /c/murmuration /contribute /api/auth/get-session; do
                  serves "$path" || ok=0
                done
                break
              fi
              sleep 2
            done
            kill -0 "$pid" 2>/dev/null || ok=0
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 15); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            kill -9 "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            for _ in $(seq 1 30); do
              curl -s -o /dev/null --max-time 2 "$base/" || break
              sleep 1
            done
            if [ "$ok" = 1 ]; then
              echo "astro dev served every warm-up page on attempt $attempt"
              exit 0
            fi
            echo "::warning::astro dev warm-up attempt $attempt failed; log tail follows"
            tail -n 40 "$log"
          done
          echo "::error::astro dev never served the warm-up pages in 3 attempts"
          exit 1

      # Serial run (workers: 1, retries: 1 under CI) against a fresh astro dev
      # started by playwright.config.ts's webServer; global.setup.ts resets D1.
      - name: Run Playwright
        env:
          CI: 'true'
        run: npx playwright test

      # Report + traces for triage, failures only. .dev.vars never rides along:
      # it is outside these paths, and hidden files are excluded by default.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            platform/apps/web/playwright-report/
            platform/apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Gate the Cloudflare deploy on its secret actually being configured, so a repo
  # that has NOT set CLOUDFLARE_API_TOKEN yet gets a GREEN run (deploy skipped +
  # a warning annotation) instead of a red one. Secrets cannot be read in a
  # job-level `if:`, so this tiny job exposes "is the token set?" as an output
  # the deploy job gates on. Once the secret is added, deploy runs automatically.
  check-deploy-secrets:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare deploy skipped::Set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets to enable auto-deploy of embody-web to embody.tools."
          fi

  # Cloudflare deploy. Runs ONLY on push to main, after build-and-test AND e2e
  # pass (a red typecheck/build/e2e never ships) AND the deploy secret is set.
  # wrangler deploy reads platform/apps/web/wrangler.jsonc (name: embody-web), so
  # it always targets the correct Worker and its embody.tools custom domain.
  #
  # Requires two repo secrets (Settings -> Secrets and variables -> Actions):
  #   CLOUDFLARE_API_TOKEN   - token with the "Edit Cloudflare Workers" template
  #                            (Workers Scripts:Edit + the embody.tools zone).
  #   CLOUDFLARE_ACCOUNT_ID  - the account that owns the embody-web Worker.
  deploy:
    needs: [build-and-test, e2e, check-deploy-secrets]
    if: needs.check-deploy-secrets.outputs.enabled == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor flags cache-poisoning here because this job publishes to Cloudflare.
      # It is not reachable in practice: this job runs ONLY on push to main (see
      # the `if:` above), never on a fork PR -- and a fork PR cannot write the base
      # repo's Actions cache, so the npm cache restored here cannot be poisoned by
      # an untrusted run. Suppressed with justification (the ignore sits on the
      # `cache:` line to keep the `# v6.4.0` pin comment intact for Dependabot).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm  # zizmor: ignore[cache-poisoning]
          cache-dependency-path: platform/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (astro build)
        run: npm run build --workspace=@embody/web
      # Migrations are append-only, so applying before the deploy never breaks
      # the running Worker, and live code never meets an older schema (the
      # rule deploy.sh enforces by hand). Needs D1 Edit on the token.
      - name: Apply D1 migrations (production)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: platform/apps/web
          command: d1 migrations apply embody --remote
      - name: Deploy to Cloudflare (wrangler deploy)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: platform/apps/web

      # Post-deploy smoke: e2e runs on miniflare, prod runs on real D1 (field
      # 2026-09-11). One read-only GET + one bogus sign-in: never a sign-up, never
      # an email. Retries ride out edge propagation; the 15 s gap keeps our POSTs
      # under Better Auth's /sign-in limit (3 per 10 s) and ours (10 per 300 s).
      - name: Smoke-test production auth
        timeout-minutes: 10
        env:
          SMOKE_BASE: https://embody.tools
        run: |
          attempts=6
          gap=15
          body="$RUNNER_TEMP/smoke-body"
          hdrs="$RUNNER_TEMP/smoke-headers"
          snippet() { head -c 300 "$body" 2>/dev/null | tr -d '\r\n'; }
          fail() {
            echo "::error title=Production auth smoke failed::$1"
            echo "::error title=Roll back embody-web::Run 'npx wrangler rollback' from platform/apps/web, or Cloudflare dashboard > Workers > embody-web > Deployments."
            exit 1
          }

          probe() {
            # $1 expected status, $2 label, rest: curl args. Bounded retries.
            want="$1"
            label="$2"
            shift 2
            code=000
            for i in $(seq 1 "$attempts"); do
              code="$(curl -sS -o "$body" -D "$hdrs" -w '%{http_code}' --max-time 20 \
                -A 'embody-ci-smoke (+github actions)' "$@" || true)"
              if [ "$code" = "$want" ]; then
                echo "ok: $label -> $code (attempt $i)"
                return 0
              fi
              if grep -qi '^cf-mitigated:' "$hdrs" 2>/dev/null; then
                # Not a deploy fault, so no rollback advice -- but still unverified.
                echo "::error title=Production auth smoke blocked::$label was challenged by Cloudflare (cf-mitigated, HTTP $code), so auth is UNVERIFIED. Let the smoke through WAF / Bot Fight Mode, then check embody.tools by hand."
                exit 1
              fi
              echo "attempt $i/$attempts: $label -> HTTP $code, want $want. Body: $(snippet)"
              if [ "$i" -lt "$attempts" ]; then
                sleep "$gap"
              fi
            done
            fail "$label never returned HTTP $want (last: $code, body: $(snippet)). Auth is likely down on $SMOKE_BASE."
          }

          check_auth() {
            # Anonymous get-session is 200 + JSON null. Every auth route runs the
            # adapter first, so a D1 fault shows up here as a 500.
            probe 200 "GET /api/auth/get-session" \
              -H 'Accept: application/json' \
              "$SMOKE_BASE/api/auth/get-session"
            if [ "$(tr -d '[:space:]' < "$body")" != "null" ]; then
              fail "get-session returned 200 but not the anonymous null body: $(snippet)"
            fi
            # Unknown address -> 401 INVALID_EMAIL_OR_PASSWORD. Nothing is created
            # or emailed (Better Auth hashes a dummy password and answers 401).
            probe 401 "POST /api/auth/sign-in/email (unknown user)" \
              -X POST \
              -H 'Content-Type: application/json' \
              -H "Origin: $SMOKE_BASE" \
              --data '{"email":"ci-smoke@example.invalid","password":"ci-smoke-not-a-real-password"}' \
              "$SMOKE_BASE/api/auth/sign-in/email"
            if ! grep -q 'INVALID_EMAIL_OR_PASSWORD' "$body"; then
              fail "sign-in returned 401 without INVALID_EMAIL_OR_PASSWORD: $(snippet)"
            fi
          }

          # Until the new version reaches every edge the OLD one answers, so a probe
          # right after deploy can pass a broken release. Settle, then pass twice
          # (field 2026-09-11).
          sleep 45
          check_auth
          sleep 30
          check_auth
          echo "ok: production auth passed twice, 30 s apart"

  # Production specimen sync -- the half of a deploy that wrangler deploy does
  # not do. The featured cards and interactive covers are bundled into the
  # Worker, but the /api/specimens rows live in D1 and the .tdxn + cover blobs
  # in R2. This job puts the blobs (content-addressed, so re-putting is a no-op)
  # and runs first-party-sync.sql, which creates a missing first-party row,
  # updates a stale one and never deletes, so it is safe after every push to
  # main. By hand: Actions > Platform CI > Run workflow; dry_run (the default)
  # uploads blobs and prints the plan but writes no rows. The token needs
  # Workers R2 Storage:Edit and D1:Edit.
  sync-specimens:
    needs: [build-and-test, check-deploy-secrets, deploy]
    if: >-
      !cancelled()
      && needs.build-and-test.result == 'success'
      && needs.check-deploy-secrets.outputs.enabled == 'true'
      && (needs.deploy.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.deploy.result == 'skipped'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || 'false' }}
      SITE: https://embody.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same cache-poisoning reasoning as the deploy job: main-only, never a fork PR.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm  # zizmor: ignore[cache-poisoning]
          cache-dependency-path: platform/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: platform
        run: |
          npm ci
          python3 -m pip install --quiet pyyaml==6.0.2
      # The committed seed/sync/plan SQL, fixtures and blob manifest must be the
      # generator's output for the specimens/ in this commit, or the keys and
      # hashes below lie. Drift fails here, never in production.
      - name: Generated specimen data is current
        run: |
          python3 scripts/build-specimen-data.py
          git -C ../../.. diff --exit-code -- platform/apps/web/src/server/seed.sql platform/apps/web/src/server/first-party-sync.sql platform/apps/web/src/server/first-party-plan.sql platform/apps/web/src/fixtures platform/apps/web/scripts/.seed-blobs.manifest.json \
            || { echo "::error::Generated specimen data is stale. Run platform/apps/web/scripts/build-specimen-data.py and commit."; exit 1; }
      # Recovery point. D1 Time Travel keeps 30 days; this bookmark names the
      # state right before this run (wrangler d1 time-travel restore embody --bookmark=<id>).
      - name: Record D1 Time Travel bookmark
        run: |
          { echo '### D1 bookmark before sync'; echo '```'; npx wrangler d1 time-travel info embody < /dev/null; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload specimen blobs to R2 (remote)
        run: |
          count=0
          while IFS=$'\t' read -r slug key sha ctype rel; do
            f="../../../$rel"
            got="$(sha256sum "$f" | cut -d' ' -f1)"
            if [ "$got" != "$sha" ]; then
              echo "::error::$rel hashes to $got; the committed blob manifest says $sha ($slug). Rerun scripts/build-specimen-data.py and commit."
              exit 1
            fi
            npx wrangler r2 object put "embody-blobs/$key" --file="$f" --content-type "$ctype" --remote < /dev/null
            count=$((count + 1))
          done < <(node -e 'for (const e of require("./scripts/.seed-blobs.manifest.json")) console.log([e.slug, e.key, e.sha256, e.content_type, e.path].join("\t"))')
          echo "put $count blobs (networks + covers) into embody-blobs"
      # Read-only plan: one row per slug (found, first_party, live vs repo sha,
      # stale). A slug another author holds (one the user published through the
      # site under their own account, e.g. thermite-and-freon by rosco on
      # 2026-10-08) is theirs: the sync never touches it, this step warns, and
      # the verification below skips it. Parsing must fail loudly: a silent
      # parse failure here let the first run skip this check (2026-10-17).
      - name: Plan (what the sync would change)
        run: |
          set -o pipefail
          # One --command per statement: a remote --file goes through D1's import
          # API and returns only meta, never the SELECT rows (field 2026-10-17).
          node - src/server/first-party-plan.sql "$RUNNER_TEMP/skip-slugs.txt" <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const sql = fs.readFileSync(process.argv[2], 'utf8').split('\n').filter(l => !l.startsWith('--')).join('\n');
          const statements = sql.split(/;\s*\n/).map(s => s.trim()).filter(Boolean);
          const rows = [];
          for (const statement of statements.slice(1)) {   // statement 0 is the FTS DDL probe
            const out = execFileSync('npx', ['wrangler', 'd1', 'execute', 'embody', '--remote', '--json', '--command', statement], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'], maxBuffer: 16 * 1024 * 1024 });
            const start = out.indexOf('[');
            if (start < 0) { console.error('::error::plan: wrangler returned no JSON:\n' + out.slice(0, 2000)); process.exit(1); }
            for (const r of JSON.parse(out.slice(start))) rows.push(...(r.results || []));
          }
          if (!rows.length) { console.error('::error::plan: no per-slug rows parsed'); process.exit(1); }
          console.log('### First-party sync plan');
          console.log('| slug | found | first_party | author | stale | live sha | repo sha |');
          console.log('|---|---|---|---|---|---|---|');
          const skip = [];
          for (const r of rows) {
            const held = r.found === 1 && r.first_party !== 1;
            const stale = r.found !== 1 ? 'new' : held ? 'held' : r.stale;
            console.log(`| ${r.slug} | ${r.found} | ${r.first_party ?? ''} | ${r.author_handle ?? ''} | ${stale} | ${(r.live_sha || '').slice(0, 12)} | ${String(r.repo_sha).slice(0, 12)} |`);
            if (held) {
              skip.push(r.slug);
              console.log(`::warning title=${r.slug} is held by @${r.author_handle}::the sync leaves it alone and the live check skips it; to make the repo copy the live one, publish it from the envoy account or hand the slug over.`);
            }
          }
          fs.writeFileSync(process.argv[3], skip.join('\n') + (skip.length ? '\n' : ''));
          JS
      - name: Apply first-party-sync.sql (production)
        if: env.DRY_RUN != 'true'
        run: npx wrangler d1 execute embody --remote --yes --file=src/server/first-party-sync.sql < /dev/null
      # Acceptance is the live site, not wrangler's exit code: every first-party
      # .tdxn must download with the repo's sha256 and its cover must serve.
      # Retries ride out edge propagation. Slugs the plan marked as held by
      # another author are skipped (the sync did not write them).
      - name: Verify the live collection
        if: env.DRY_RUN != 'true'
        timeout-minutes: 10
        run: |
          set -o pipefail
          fail=0
          while IFS=$'\t' read -r slug sha; do
            if grep -qx "$slug" "$RUNNER_TEMP/skip-slugs.txt" 2>/dev/null; then
              echo "skip: $slug is held by another author (see the plan)"
              continue
            fi
            ok=0
            for i in 1 2 3 4 5 6; do
              got="$(curl -sS --max-time 30 -A 'embody-ci-sync (+github actions)' "$SITE/api/specimens/$slug/tdn" | sha256sum | cut -d' ' -f1)"
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -A 'embody-ci-sync (+github actions)' "$SITE/api/specimens/$slug/thumbnail")"
              if [ "$got" = "$sha" ] && [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" = 1 ]; then echo "ok: $slug (tdn sha matches, cover $code)"; else echo "::error::$slug: tdn sha $got != $sha, or cover $code"; fail=1; fi
          done < <(node -e 'for (const e of require("./scripts/.seed-blobs.manifest.json")) if (e.kind === "tdxn") console.log([e.slug, e.sha256].join("\t"))')
          # Cover videos: the /video route must stream the repo bytes (Range-capable, so a plain GET returns the whole file).
          while IFS=$'\t' read -r slug sha; do
            if grep -qx "$slug" "$RUNNER_TEMP/skip-slugs.txt" 2>/dev/null; then continue; fi
            ok=0
            for i in 1 2 3 4 5 6; do
              got="$(curl -sS --max-time 60 -A 'embody-ci-sync (+github actions)' "$SITE/api/specimens/$slug/video" | sha256sum | cut -d' ' -f1)"
              if [ "$got" = "$sha" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" = 1 ]; then echo "ok: $slug (cover video sha matches)"; else echo "::error::$slug: cover video sha $got != $sha"; fail=1; fi
          done < <(node -e 'for (const e of require("./scripts/.seed-blobs.manifest.json")) if (e.kind === "video") console.log([e.slug, e.sha256].join("\t"))')
          exit $fail
