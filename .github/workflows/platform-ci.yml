name: Platform CI

# specimens/** too: e2e seeds R2 from it and checks it against seed.sql, and an
# Embody save re-exports it in commits that touch no platform/ file (field
# 2026-09-11). Drift must fail on the commit that makes it, not a later PR.
on:
  push:
    paths:
      - 'platform/**'
      - 'specimens/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - 'specimens/**'
      - '.github/workflows/platform-ci.yml'
  # Manual first-party specimen sync (job sync-specimens only; main only).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Probe the token and plan the specimen sync without writing to production'
        type: boolean
        default: true

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes. The event is in the
# key so a manual sync never cancels a push run's deploy, or the reverse.
concurrency:
  group: platform-ci-${{ github.ref }}-${{ github.event_name }}
  # Superseded PR/branch runs are cancelled, but a push to main is NOT: that
  # run deploys and then syncs prod, and a second merge landing 31 s later
  # cancelled the first one's deploy mid-flight (field 2026-09-12). Main runs
  # queue behind each other instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || github.event_name != 'push' }}

jobs:
  build-and-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Astro requires Node >=22.12.0 (astro check/build abort on Node 20).
          node-version: '22'
          # Cache npm downloads keyed off the platform-root lockfile.
          cache: npm
          cache-dependency-path: platform/package-lock.json

      # Installs every workspace (apps/web + packages/*) from the root lockfile.
      - name: Install dependencies
        run: npm ci

      # Typecheck the Astro app (astro check). Runs against the web workspace.
      - name: Typecheck (astro check)
        run: npm run typecheck --workspace=@embody/web

      # Production build of the Astro + Cloudflare worker app.
      - name: Build (astro build)
        run: npm run build --workspace=@embody/web

      # Scanner unit tests (vitest run).
      - name: Test scanner-ts
        run: npm run test --workspace=@embody/scanner-ts

  # ---------------------------------------------------------------------------
  # Playwright e2e against `astro dev` on local miniflare D1/R2 -- the only job
  # that runs Better Auth against a real D1. A green typecheck + build shipped a
  # 500 on every /api/auth/* for ~23h (field 2026-09-11); deploy now needs this
  # job, so a dependency bump that breaks auth (or any e2e flow) never ships.
  e2e:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: platform/apps/web
    env:
      E2E_PORT: '4321'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      # Browsers are cached per Playwright version. The apt packages are not,
      # so a cache hit still installs the system deps.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # .dev.vars is gitignored. ENVIRONMENT=development turns off Turnstile,
      # both rate limiters and Secure-only cookies (plain http here). The auth
      # secret is random per run and never printed.
      - name: Write .dev.vars
        run: |
          umask 077
          printf 'ENVIRONMENT=development\nBETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > .dev.vars

      # --local needs no Cloudflare login; under CI wrangler auto-confirms.
      - name: Apply D1 migrations (local)
        run: npx wrangler d1 migrations apply embody --local

      # The production sync SQL, on a real D1 engine, before it can ever point at
      # prod: seed, apply, and require the plan to come back clean. global.setup
      # reseeds before the specs, so this leaves the suite untouched.
      - name: Rehearse first-party-sync.sql on the local D1
        run: |
          npx wrangler d1 execute embody --local --file=src/server/seed.sql > /dev/null
          npx wrangler d1 execute embody --local --file=src/server/first-party-sync.sql > /dev/null
          sql="$(grep -v '^--' src/server/first-party-plan.sql)"
          npx wrangler d1 execute embody --local --json --command="$sql" > "$RUNNER_TEMP/plan-local.json"
          python3 scripts/first-party-sync-report.py plan "$RUNNER_TEMP/plan-local.json" after

      # global.setup.ts reseeds D1 only. The collection and viewer specs also
      # need the specimen .tdxn blobs in local R2, keyed by sha256 (= tdn_r2_key
      # in seed.sql). Reads specimens/manifest.json directly, so the check below
      # hashes the files themselves, not the generated blob manifest.
      - name: Seed local R2 with specimen blobs
        run: |
          count=0
          while read -r rel; do
            f="../../../specimens/$rel"
            sha="$(sha256sum "$f" | cut -d' ' -f1)"
            if ! grep -q "'$sha'" src/server/seed.sql; then
              echo "::error::specimens/$rel hashes to $sha, which seed.sql does not reference. Rerun scripts/build-specimen-data.py."
              exit 1
            fi
            npx wrangler r2 object put "embody-blobs/$sha" --file="$f" --local < /dev/null
            count=$((count + 1))
          done < <(node -e 'for (const s of require("../../../specimens/manifest.json").specimens) console.log(s.tdxn_path)')
          if [ "$count" -eq 0 ]; then
            echo "::error::specimens/manifest.json listed no specimens"
            exit 1
          fi
          echo "seeded $count specimen blobs"

      # A cold node_modules/.vite can kill the first `astro dev` boot: the SSR
      # optimizer finds a late dep, reloads, and workerd imports a chunk that was
      # just replaced (field 2026-09-11). Boot until the auth + collection pages
      # serve, retrying, so Playwright's own webServer starts on a warm cache.
      - name: Warm the Vite dep cache
        timeout-minutes: 12
        env:
          ASTRO_DEV_BACKGROUND: '1'
        run: |
          base="http://127.0.0.1:$E2E_PORT"
          log="$RUNNER_TEMP/astro-warm.log"
          serves() {
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$base$1" || true)"
            [ "$code" -ge 200 ] && [ "$code" -lt 500 ]
          }
          for attempt in 1 2 3; do
            ../../node_modules/.bin/astro dev --port "$E2E_PORT" --host 127.0.0.1 > "$log" 2>&1 &
            pid=$!
            ok=0
            for _ in $(seq 1 60); do
              kill -0 "$pid" 2>/dev/null || break
              if serves /; then
                ok=1
                for path in /signin /forgot-password /collection /c/murmuration /contribute /api/auth/get-session; do
                  serves "$path" || ok=0
                done
                break
              fi
              sleep 2
            done
            kill -0 "$pid" 2>/dev/null || ok=0
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 15); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            kill -9 "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            for _ in $(seq 1 30); do
              curl -s -o /dev/null --max-time 2 "$base/" || break
              sleep 1
            done
            if [ "$ok" = 1 ]; then
              echo "astro dev served every warm-up page on attempt $attempt"
              exit 0
            fi
            echo "::warning::astro dev warm-up attempt $attempt failed; log tail follows"
            tail -n 40 "$log"
          done
          echo "::error::astro dev never served the warm-up pages in 3 attempts"
          exit 1

      # Serial run (workers: 1, retries: 1 under CI) against a fresh astro dev
      # started by playwright.config.ts's webServer; global.setup.ts resets D1.
      - name: Run Playwright
        env:
          CI: 'true'
        run: npx playwright test

      # Report + traces for triage, failures only. .dev.vars never rides along:
      # it is outside these paths, and hidden files are excluded by default.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: |
            platform/apps/web/playwright-report/
            platform/apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Gate the Cloudflare deploy on its secret actually being configured, so a repo
  # that has NOT set CLOUDFLARE_API_TOKEN yet gets a GREEN run (deploy skipped +
  # a warning annotation) instead of a red one. Secrets cannot be read in a
  # job-level `if:`, so this tiny job exposes "is the token set?" as an output
  # the deploy job gates on. Once the secret is added, deploy runs automatically.
  check-deploy-secrets:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare deploy skipped::Set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets to enable auto-deploy of embody-web to embody.tools."
          fi

  # Cloudflare deploy. Runs ONLY on push to main, after build-and-test AND e2e
  # pass (a red typecheck/build/e2e never ships) AND the deploy secret is set.
  # wrangler deploy reads platform/apps/web/wrangler.jsonc (name: embody-web), so
  # it always targets the correct Worker and its embody.tools custom domain.
  #
  # Requires two repo secrets (Settings -> Secrets and variables -> Actions):
  #   CLOUDFLARE_API_TOKEN   - token with the "Edit Cloudflare Workers" template
  #                            (Workers Scripts:Edit + the embody.tools zone).
  #   CLOUDFLARE_ACCOUNT_ID  - the account that owns the embody-web Worker.
  deploy:
    needs: [build-and-test, e2e, check-deploy-secrets]
    if: needs.check-deploy-secrets.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor flags cache-poisoning here because this job publishes to Cloudflare.
      # It is not reachable in practice: this job runs ONLY on push to main (see
      # the `if:` above), never on a fork PR -- and a fork PR cannot write the base
      # repo's Actions cache, so the npm cache restored here cannot be poisoned by
      # an untrusted run. Suppressed with justification (the ignore sits on the
      # `cache:` line to keep the `# v6.4.0` pin comment intact for Dependabot).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm  # zizmor: ignore[cache-poisoning]
          cache-dependency-path: platform/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (astro build)
        run: npm run build --workspace=@embody/web
      - name: Deploy to Cloudflare (wrangler deploy)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: platform/apps/web

      # Post-deploy smoke: e2e runs on miniflare, prod runs on real D1 (field
      # 2026-09-11). One read-only GET + one bogus sign-in: never a sign-up, never
      # an email. Retries ride out edge propagation; the 15 s gap keeps our POSTs
      # under Better Auth's /sign-in limit (3 per 10 s) and ours (10 per 300 s).
      - name: Smoke-test production auth
        timeout-minutes: 10
        env:
          SMOKE_BASE: https://embody.tools
        run: |
          attempts=6
          gap=15
          body="$RUNNER_TEMP/smoke-body"
          hdrs="$RUNNER_TEMP/smoke-headers"
          snippet() { head -c 300 "$body" 2>/dev/null | tr -d '\r\n'; }
          fail() {
            echo "::error title=Production auth smoke failed::$1"
            echo "::error title=Roll back embody-web::Run 'npx wrangler rollback' from platform/apps/web, or Cloudflare dashboard > Workers > embody-web > Deployments."
            exit 1
          }

          probe() {
            # $1 expected status, $2 label, rest: curl args. Bounded retries.
            want="$1"
            label="$2"
            shift 2
            code=000
            for i in $(seq 1 "$attempts"); do
              code="$(curl -sS -o "$body" -D "$hdrs" -w '%{http_code}' --max-time 20 \
                -A 'embody-ci-smoke (+github actions)' "$@" || true)"
              if [ "$code" = "$want" ]; then
                echo "ok: $label -> $code (attempt $i)"
                return 0
              fi
              if grep -qi '^cf-mitigated:' "$hdrs" 2>/dev/null; then
                # Not a deploy fault, so no rollback advice -- but still unverified.
                echo "::error title=Production auth smoke blocked::$label was challenged by Cloudflare (cf-mitigated, HTTP $code), so auth is UNVERIFIED. Let the smoke through WAF / Bot Fight Mode, then check embody.tools by hand."
                exit 1
              fi
              echo "attempt $i/$attempts: $label -> HTTP $code, want $want. Body: $(snippet)"
              if [ "$i" -lt "$attempts" ]; then
                sleep "$gap"
              fi
            done
            fail "$label never returned HTTP $want (last: $code, body: $(snippet)). Auth is likely down on $SMOKE_BASE."
          }

          check_auth() {
            # Anonymous get-session is 200 + JSON null. Every auth route runs the
            # adapter first, so a D1 fault shows up here as a 500.
            probe 200 "GET /api/auth/get-session" \
              -H 'Accept: application/json' \
              "$SMOKE_BASE/api/auth/get-session"
            if [ "$(tr -d '[:space:]' < "$body")" != "null" ]; then
              fail "get-session returned 200 but not the anonymous null body: $(snippet)"
            fi
            # Unknown address -> 401 INVALID_EMAIL_OR_PASSWORD. Nothing is created
            # or emailed (Better Auth hashes a dummy password and answers 401).
            probe 401 "POST /api/auth/sign-in/email (unknown user)" \
              -X POST \
              -H 'Content-Type: application/json' \
              -H "Origin: $SMOKE_BASE" \
              --data '{"email":"ci-smoke@example.invalid","password":"ci-smoke-not-a-real-password"}' \
              "$SMOKE_BASE/api/auth/sign-in/email"
            if ! grep -q 'INVALID_EMAIL_OR_PASSWORD' "$body"; then
              fail "sign-in returned 401 without INVALID_EMAIL_OR_PASSWORD: $(snippet)"
            fi
          }

          # Until the new version reaches every edge the OLD one answers, so a probe
          # right after deploy can pass a broken release. Settle, then pass twice
          # (field 2026-09-11).
          sleep 45
          check_auth
          sleep 30
          check_auth
          echo "ok: production auth passed twice, 30 s apart"

  # ---------------------------------------------------------------------------
  # First-party specimen sync. Prod was seeded once (2026-06-15) and then served
  # those blobs for months: the only documented path was seed.sql, which wipes
  # search and purges slugs (field 2026-09-11). Applies the targeted, idempotent
  # first-party-sync.sql after a deploy that touched a specimen input, or on
  # demand (dry_run defaults on). README: "Updating the specimens on embody.tools".
  # The token needs Account > D1 > Edit and Account > Workers R2 Storage > Edit.
  sync-specimens:
    needs: [deploy]
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
         needs.deploy.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # One sync at a time across runs; never cancel one mid-write.
    concurrency:
      group: specimen-sync-production
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: platform/apps/web
    env:
      WRANGLER_TARGET: --remote
      SITE_BASE: https://embody.tools
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every main deploy runs the read-only plan against prod and syncs only
      # what differs, rather than diffing this push: a cancelled or failed sync
      # must not leave prod stale until someone notices (field 2026-09-12).
      # Dispatch: main only, since it publishes the checked-out ref's specimens.
      - name: Decide whether to sync
        id: gate
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          run=true
          dry=false
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != refs/heads/main ]; then
              echo "::error title=Specimen sync::Run it from main, not $REF: it publishes the checked-out specimens to embody.tools."
              exit 1
            fi
            dry="$DRY_RUN_INPUT"
          fi
          case "$dry" in true|false) ;; *) echo "::error::dry_run must be true or false, got '$dry'"; exit 1;; esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "run=$run dry_run=$dry"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'

      # No npm cache: this job writes to production, so it restores nothing
      # another run could have written to the Actions cache.
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: platform
        run: npm ci

      # The committed SQL must carry every specimen file's sha256, or the sync
      # would publish an older export. Also stages the LF bytes for upload.
      # Regenerate from specimens/ + manifest.json and require no diff: a sha-only
      # check passes a metadata-only manifest edit, which would sync stale titles
      # and tags (field 2026-09-12).
      - name: Check the generated sync matches specimens/
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 scripts/build-specimen-data.py > /dev/null
          if ! git -C ../../.. diff --exit-code --stat -- \
               platform/apps/web/src/server/seed.sql \
               platform/apps/web/src/server/first-party-sync.sql \
               platform/apps/web/src/server/first-party-plan.sql \
               platform/apps/web/src/fixtures/specimens.json \
               platform/apps/web/src/fixtures/specimen-graphs.ts \
               platform/apps/web/scripts/.seed-blobs.manifest.json; then
            echo "::error title=Stale generated specimen data::Run python3 platform/apps/web/scripts/build-specimen-data.py and commit the result."
            exit 1
          fi
          python3 scripts/first-party-sync-report.py blobs "$RUNNER_TEMP/blobs" | tee "$RUNNER_TEMP/blobs.tsv"

      # A zero-row UPDATE proves D1 write access without writing. R2 access is
      # proven by the blob check (read) and the upload (write).
      - name: Probe the Cloudflare token
        if: steps.gate.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$WRANGLER_TARGET" = --remote ] && [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Specimen sync::The CLOUDFLARE_API_TOKEN repo secret is not set."
            exit 1
          fi
          probe() {
            label="$1"; perm="$2"; shift 2
            if out="$("$@" 2>&1 < /dev/null)"; then echo "ok: $label"; return 0; fi
            if printf '%s' "$out" | grep -qiE 'authenticat|unauthori[sz]ed|not authori[sz]ed|forbidden|permission|code: (10000|10001|9109|7403)'; then
              echo "::error title=Cloudflare token needs $perm::$label was refused. Add $perm to the API token behind the CLOUDFLARE_API_TOKEN secret (dash.cloudflare.com > My Profile > API Tokens > Edit), then re-run this workflow."
            else
              echo "::error title=Token probe failed::$label failed, and not with an obvious permission error. It needs $perm."
            fi
            printf '%s\n' "$out" | tail -n 20
            exit 1
          }
          probe "D1 read (SELECT 1)" "Account > D1 > Edit" \
            npx wrangler d1 execute embody "$WRANGLER_TARGET" --json --command="SELECT 1 AS ok"
          probe "D1 write (zero-row UPDATE)" "Account > D1 > Edit" \
            npx wrangler d1 execute embody "$WRANGLER_TARGET" --json --command="UPDATE specimens SET slug = slug WHERE 0"
          if [ "$WRANGLER_TARGET" = --remote ]; then
            probe "D1 Time Travel (bookmark read)" "Account > D1 > Edit" \
              npx wrangler d1 time-travel info embody --json
          fi

      # yargs reads a --command value that starts with "--" as flags, so the
      # plan's comment lines are stripped and the value is passed with "=".
      - name: Plan the sync (read-only)
        id: plan
        if: steps.gate.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sql="$(grep -v '^--' src/server/first-party-plan.sql)"
          if ! npx wrangler d1 execute embody "$WRANGLER_TARGET" --json --command="$sql" \
               > "$RUNNER_TEMP/plan-before.json" < /dev/null; then
            cat "$RUNNER_TEMP/plan-before.json"
            exit 1
          fi
          python3 scripts/first-party-sync-report.py plan "$RUNNER_TEMP/plan-before.json" before

      - name: Check the blobs in R2
        id: blobs
        if: steps.gate.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          : > "$RUNNER_TEMP/missing.tsv"
          while IFS=$'\t' read -r slug sha size file; do
            got="$RUNNER_TEMP/r2-$sha"
            if npx wrangler r2 object get "embody-blobs/$sha" "$WRANGLER_TARGET" --pipe > "$got" 2> "$got.err" < /dev/null; then
              if [ "$(sha256sum < "$got" | cut -d' ' -f1)" = "$sha" ]; then
                echo "present: $slug $sha"
                continue
              fi
              echo "::warning::embody-blobs/$sha does not hash to its key; uploading it again"
            elif grep -qiE 'does not exist|NoSuchKey|code: 10007' "$got.err"; then
              echo "missing: $slug $sha"
            else
              echo "::error title=Cloudflare token needs Account > Workers R2 Storage > Edit::Reading embody-blobs/$sha failed. If the output below is an authorization error, add that permission to the API token behind CLOUDFLARE_API_TOKEN."
              tail -n 20 "$got.err"
              exit 1
            fi
            printf '%s\t%s\t%s\t%s\n' "$slug" "$sha" "$size" "$file" >> "$RUNNER_TEMP/missing.tsv"
            missing=$((missing + 1))
          done < "$RUNNER_TEMP/blobs.tsv"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Decide the writes
        id: todo
        if: steps.gate.outputs.run == 'true'
        env:
          DRY: ${{ steps.gate.outputs.dry_run }}
          STALE: ${{ steps.plan.outputs.stale }}
          FTS: ${{ steps.plan.outputs.fts }}
          MISSING: ${{ steps.blobs.outputs.missing }}
        run: |
          echo "stale first-party rows: $STALE; blobs to upload: $MISSING; search rows: $FTS"
          write=false
          if [ "$STALE" = 0 ] && [ "$MISSING" = 0 ]; then
            echo "Production D1 and R2 already match the repo; nothing to write."
          elif [ "$DRY" = true ]; then
            echo "::notice title=Dry run::Would upload $MISSING blob(s) and update $STALE first-party row(s). Re-run with dry_run off to apply."
            echo "::group::SQL a real run applies (src/server/first-party-sync.sql)"
            cat src/server/first-party-sync.sql
            echo "::endgroup::"
          else
            write=true
          fi
          echo "write=$write" >> "$GITHUB_OUTPUT"

      # Time Travel keeps 30 days (paid plan). Restoring reverts EVERY D1 write
      # since, so the summary offers the targeted rollback first.
      - name: Record a D1 Time Travel bookmark
        id: bookmark
        if: steps.todo.outputs.write == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$WRANGLER_TARGET" != --remote ]; then
            echo "Local D1 has no Time Travel; nothing to record."
            exit 0
          fi
          npx wrangler d1 time-travel info embody --json > "$RUNNER_TEMP/bookmark.json" < /dev/null
          bookmark="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("bookmark") or "")' "$RUNNER_TEMP/bookmark.json")"
          if [ -z "$bookmark" ]; then
            echo "::error title=Specimen sync::No D1 Time Travel bookmark came back; refusing to write without a rollback point."
            cat "$RUNNER_TEMP/bookmark.json"
            exit 1
          fi
          echo "bookmark=$bookmark" >> "$GITHUB_OUTPUT"
          echo "::notice title=D1 rollback point::npx wrangler d1 time-travel restore embody --bookmark=$bookmark"

      # Content-addressed keys: a blob changes nothing until D1 points at it, so
      # blobs go first and are read back before any SQL runs.
      - name: Upload missing blobs to R2
        if: steps.todo.outputs.write == 'true' && steps.blobs.outputs.missing != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          while IFS=$'\t' read -r slug sha size file; do
            if ! out="$(npx wrangler r2 object put "embody-blobs/$sha" --file="$file" \
                  --content-type application/json "$WRANGLER_TARGET" 2>&1 < /dev/null)"; then
              echo "::error title=Cloudflare token needs Account > Workers R2 Storage > Edit::Uploading embody-blobs/$sha ($slug) failed. If the output below is an authorization error, add that permission to the API token behind CLOUDFLARE_API_TOKEN."
              printf '%s\n' "$out" | tail -n 20
              exit 1
            fi
            back="$(npx wrangler r2 object get "embody-blobs/$sha" "$WRANGLER_TARGET" --pipe < /dev/null | sha256sum | cut -d' ' -f1)"
            if [ "$back" != "$sha" ]; then
              echo "::error title=Specimen sync::embody-blobs/$sha reads back as $back after the upload."
              exit 1
            fi
            echo "uploaded: $slug $sha ($size bytes)"
          done < "$RUNNER_TEMP/missing.tsv"

      # --file runs through the D1 import API: one atomic unit, so a failure
      # leaves the database as it was. Every statement is gated on a difference.
      - name: Apply first-party-sync.sql
        id: apply
        if: steps.todo.outputs.write == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 execute embody "$WRANGLER_TARGET" --yes --json \
               --file=src/server/first-party-sync.sql > "$RUNNER_TEMP/apply.json" < /dev/null; then
            cat "$RUNNER_TEMP/apply.json"
            exit 1
          fi
          # Recorded BEFORE the summary parse: a parse hiccup must not skip the
          # post-write verification below (field 2026-09-12).
          echo "applied=true" >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/apply.json" <<'PY' || echo "::warning title=Apply summary::could not parse the apply output; the write itself succeeded"
          import json, sys
          res = json.load(open(sys.argv[1]))
          head = (res[0].get("results") or [{}])[0] if res else {}
          if "Rows written" in head:
              print(f"applied: {head['Total queries executed']} queries, {head['Rows written']} rows written")
          else:
              print(f"applied: {len(res)} statements (local D1 reports no row counts)")
          PY

      - name: Check D1 matches the repo
        if: ${{ !cancelled() && steps.apply.outputs.applied == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sql="$(grep -v '^--' src/server/first-party-plan.sql)"
          if ! npx wrangler d1 execute embody "$WRANGLER_TARGET" --json --command="$sql" \
               > "$RUNNER_TEMP/plan-after.json" < /dev/null; then
            cat "$RUNNER_TEMP/plan-after.json"
            exit 1
          fi
          python3 scripts/first-party-sync-report.py plan "$RUNNER_TEMP/plan-after.json" after

      # The release preflight's own check: sha256 of each live /tdn (cache-
      # busted) against the repo file. A dry run only reports.
      - name: Verify embody.tools serves the repo specimens
        if: ${{ !cancelled() && (steps.apply.outputs.applied == 'true' || steps.todo.outputs.write == 'false') }}
        env:
          DRY: ${{ steps.gate.outputs.dry_run }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python3 ../../../dev/release_preflight.py --specimens-only --site "$SITE_BASE"; then
              exit 0
            fi
            if [ "$DRY" = true ]; then
              echo "::warning title=Specimens are stale on $SITE_BASE::Dry run: nothing was written. Re-run with dry_run off to sync."
              exit 0
            fi
            echo "attempt $attempt/6: $SITE_BASE does not serve the repo specimens yet"
            sleep 10
          done
          # A challenged runner is UNVERIFIED, not stale -- say which (field 2026-09-12).
          if curl -sS -D "$RUNNER_TEMP/verify-headers" -o /dev/null --max-time 20 \
               "$SITE_BASE/api/specimens/murmuration/tdn" &&
             grep -qi '^cf-mitigated:' "$RUNNER_TEMP/verify-headers"; then
            echo "::error title=Specimen check blocked::Cloudflare challenged the runner (cf-mitigated), so the live bytes are UNVERIFIED. Let it through WAF / Bot Fight Mode, then check by hand."
            exit 1
          fi
          echo "::error title=Stale specimens on $SITE_BASE::The live /tdn bytes still differ from specimens/ after the sync. Roll back with the SQL in the job summary, then investigate."
          exit 1

      - name: Summarize the sync
        if: always() && steps.gate.outputs.run == 'true'
        env:
          DRY: ${{ steps.gate.outputs.dry_run }}
          STALE: ${{ steps.plan.outputs.stale }}
          FTS: ${{ steps.plan.outputs.fts }}
          MISSING: ${{ steps.blobs.outputs.missing }}
          WRITE: ${{ steps.todo.outputs.write }}
          APPLIED: ${{ steps.apply.outputs.applied }}
          BOOKMARK: ${{ steps.bookmark.outputs.bookmark }}
        run: |
          {
            echo "## First-party specimen sync"
            echo ""
            echo "- dry run: ${DRY:-?}; writes planned: ${WRITE:-false}; D1 sync applied: ${APPLIED:-false}"
            echo "- stale first-party rows before: ${STALE:-?}; blobs to upload: ${MISSING:-?}; search rows: ${FTS:-?}"
            if [ "$APPLIED" = true ] && [ -s "$RUNNER_TEMP/rollback.sql" ]; then
              echo ""
              echo "### Roll back"
              echo "Preferred: repoint the six to their previous versions (the old blobs stay in R2)."
              echo "Save this as rollback.sql and run \`npx wrangler d1 execute embody --remote --file=rollback.sql\` from platform/apps/web with the deploy token:"
              echo ""
              echo '```sql'
              cat "$RUNNER_TEMP/rollback.sql"
              echo '```'
            fi
            if [ -n "$BOOKMARK" ]; then
              echo ""
              echo "Last resort, database-wide (reverts EVERY D1 write since, likes and sign-ups included):"
              echo "\`npx wrangler d1 time-travel restore embody --bookmark=$BOOKMARK\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
