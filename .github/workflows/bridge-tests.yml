name: bridge-tests

# A-51 (Convoy Phase 0 test-runner story): the Envoy bridge is single-file
# stdlib-only Python, so its suite runs OUTSIDE TouchDesigner under pytest
# via the dual-runner shim (dev/embody/unit_tests/conftest.py). The macOS
# leg is the point -- it executes the darwin quit/launch paths and the
# pgrep-based find_all_td_pids tests that are skip-only on the Windows dev
# box and landed flagged "unverified on mac" (commit e28b73e). TD-bound
# tests skip cleanly off-TD; a skip explosion still shows in the -ra
# summary.
#
# The Convoy suites ride the same matrix (see pytest.ini testpaths): the
# host app and its TD-side client twin are stdlib-only too, and
# test_convoy_client.py's PARITY test is the only thing keeping the two
# copies of the probe decision tree -- convoy_hostprobe.py and
# Embody/convoy/convoy_client.py -- in agreement.

on:
  push:
    paths:
      - 'dev/embody/envoy_bridge.py'
      - 'dev/embody/Embody/templates/text_envoy_bridge.py'
      - 'dev/embody/unit_tests/test_envoy_bridge.py'
      - 'dev/embody/unit_tests/test_convoy_client.py'
      - 'dev/embody/unit_tests/conftest.py'
      - 'dev/embody/Embody/convoy/**'
      - 'dev/convoy/**'
      - 'pytest.ini'
      - '.github/workflows/bridge-tests.yml'
  pull_request:
    paths:
      - 'dev/embody/envoy_bridge.py'
      - 'dev/embody/Embody/templates/text_envoy_bridge.py'
      - 'dev/embody/unit_tests/test_envoy_bridge.py'
      - 'dev/embody/unit_tests/test_convoy_client.py'
      - 'dev/embody/unit_tests/conftest.py'
      - 'dev/embody/Embody/convoy/**'
      - 'dev/convoy/**'
      - 'pytest.ini'
      - '.github/workflows/bridge-tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # `cryptography` is the Convoy host app's ONE third-party
      # dependency, scoped to dev/convoy/convoy_hostkeys.py and pinned
      # there by an import-isolation test. It is installed here so the
      # identity suite RUNS -- including the spike test that re-proves,
      # on windows-latest AND macos-latest, that the bundled OpenSSL
      # negotiates mutual TLS 1.3 with an Ed25519 leaf certificate.
      #
      # A FLOOR, NOT A PIN, and no upper bound: an exact pin is what
      # broke fresh Envoy installs when the MCP SDK went 2.0, and the
      # host app degrades gracefully rather than crashing when the
      # package is absent, so CI tracking the current release is the
      # useful signal. 3.4 is the floor for the modern
      # load_pem_private_key / Ed25519 X.509 surface used here.
      - name: Install pytest and the host-identity dependency
        run: python -m pip install --quiet pytest "cryptography>=3.4"
      - name: Run the bridge suite
        run: python -m pytest -v
