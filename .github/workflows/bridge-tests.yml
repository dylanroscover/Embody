name: bridge-tests

# A-51 (Convoy Phase 0 test-runner story): the Envoy bridge is single-file
# stdlib-only Python, so its suite runs OUTSIDE TouchDesigner under pytest
# via the dual-runner shim (dev/embody/unit_tests/conftest.py). The macOS
# leg is the point -- it executes the darwin quit/launch paths and the
# pgrep-based find_all_td_pids tests that are skip-only on the Windows dev
# box and landed flagged "unverified on mac" (commit e28b73e). TD-bound
# tests skip cleanly off-TD; a skip explosion still shows in the -ra
# summary.
#
# The Convoy suites ride the same matrix (see pytest.ini testpaths): the
# host app and its TD-side client twin are stdlib-only too, and
# test_convoy_client.py's PARITY test is the only thing keeping the two
# copies of the probe decision tree -- convoy_hostprobe.py and
# Embody/convoy/convoy_client.py -- in agreement.
#
# dev/convoy/test_convoy_host_vendor.py is the SECOND parity test, and
# the one the .tox depends on: the ten host-app modules are vendored as
# text DATs under Embody/convoy/host/ so a released .tox can install
# them, and nothing but that test notices when the two copies drift. It
# needs no new path filter -- 'dev/convoy/**' and
# 'dev/embody/Embody/convoy/**' already cover both sides of the compare.

on:
  push:
    paths:
      - 'dev/embody/envoy_bridge.py'
      - 'dev/embody/Embody/templates/text_envoy_bridge.py'
      - 'dev/embody/unit_tests/test_envoy_bridge.py'
      - 'dev/embody/unit_tests/test_convoy_client.py'
      - 'dev/embody/unit_tests/test_convoy_install.py'
      - 'dev/embody/unit_tests/test_convoy_host_ladder.py'
      - 'dev/embody/unit_tests/test_convoy_forget_ux.py'
      - 'dev/embody/unit_tests/test_convoy_realm_recovery.py'
      - 'dev/embody/unit_tests/test_convoy_parameter_contract.py'
      - 'dev/embody/unit_tests/test_startup_progress.py'
      - 'dev/embody/unit_tests/test_wizard_convoy_contract.py'
      - 'dev/embody/unit_tests/test_worker_run_lint.py'
      - 'dev/embody/unit_tests/test_thread_safety_guards.py'
      - 'dev/embody/unit_tests/test_project_saved_gate.py'
      - 'dev/embody/unit_tests/test_promoted_surface.py'
      # The promoted-surface census reads the extension sources and the
      # caller index, so a change to either must trigger it.
      - 'dev/embody/Embody/**/*.py'
      - 'dev/embody/Embody/toolbar/toolbar_config.tsv'
      - 'docs/reports/issue-94-caller-index.json'
      # 63 untrusted-import security tests that ran on no runner at all.
      - 'dev/embody/Embody/Collection/tests/**'
      # C8 scanner parity: the shared corpus is ONE corpus in two directories,
      # so an edit to either side has to run the mirror + ledger checks.
      - 'dev/embody/unit_tests/test_scanner_parity.py'
      - 'dev/embody/unit_tests/fixtures/**'
      - 'platform/packages/scanner-ts/fixtures/**'
      # C7 schema validation of every committed TDXN document, and the C1
      # canonical-serialization corpus shared with scanner-ts.
      - 'dev/embody/unit_tests/test_tdn_schema.py'
      - 'docs/tdn.schema.yaml'
      - 'dev/**/*.tdn'
      - 'dev/**/*.tdxn'
      - 'specimens/**'
      - 'platform/packages/contracts/fixtures/**'
      - 'pytest.ini'
      - 'dev/embody/unit_tests/test_embody_pyenv.py'
      - 'dev/embody/unit_tests/test_pyenv_context.py'
      - 'dev/embody/Embody/embody_pyenv.py'
      - 'dev/embody/Embody/embody_git.py'
      - 'dev/embody/Embody/EnvoyExt.py'
      - 'dev/embody/Embody/startup_progress.py'
      - 'dev/embody/Embody/wizard.tdn'
      - 'dev/embody/Embody/wizard/**'
      - 'dev/embody/unit_tests/conftest.py'
      - 'dev/embody/Embody/convoy/**'
      - 'dev/convoy/**'
      - 'pytest.ini'
      - '.github/workflows/bridge-tests.yml'
  pull_request:
    paths:
      - 'dev/embody/envoy_bridge.py'
      - 'dev/embody/Embody/templates/text_envoy_bridge.py'
      - 'dev/embody/unit_tests/test_envoy_bridge.py'
      - 'dev/embody/unit_tests/test_convoy_client.py'
      - 'dev/embody/unit_tests/test_convoy_install.py'
      - 'dev/embody/unit_tests/test_convoy_host_ladder.py'
      - 'dev/embody/unit_tests/test_convoy_forget_ux.py'
      - 'dev/embody/unit_tests/test_convoy_realm_recovery.py'
      - 'dev/embody/unit_tests/test_convoy_parameter_contract.py'
      - 'dev/embody/unit_tests/test_startup_progress.py'
      - 'dev/embody/unit_tests/test_wizard_convoy_contract.py'
      - 'dev/embody/unit_tests/test_worker_run_lint.py'
      - 'dev/embody/unit_tests/test_thread_safety_guards.py'
      - 'dev/embody/unit_tests/test_project_saved_gate.py'
      - 'dev/embody/unit_tests/test_promoted_surface.py'
      # The promoted-surface census reads the extension sources and the
      # caller index, so a change to either must trigger it.
      - 'dev/embody/Embody/**/*.py'
      - 'dev/embody/Embody/toolbar/toolbar_config.tsv'
      - 'docs/reports/issue-94-caller-index.json'
      # 63 untrusted-import security tests that ran on no runner at all.
      - 'dev/embody/Embody/Collection/tests/**'
      # C8 scanner parity: the shared corpus is ONE corpus in two directories,
      # so an edit to either side has to run the mirror + ledger checks.
      - 'dev/embody/unit_tests/test_scanner_parity.py'
      - 'dev/embody/unit_tests/fixtures/**'
      - 'platform/packages/scanner-ts/fixtures/**'
      # C7 schema validation of every committed TDXN document, and the C1
      # canonical-serialization corpus shared with scanner-ts.
      - 'dev/embody/unit_tests/test_tdn_schema.py'
      - 'docs/tdn.schema.yaml'
      - 'dev/**/*.tdn'
      - 'dev/**/*.tdxn'
      - 'specimens/**'
      - 'platform/packages/contracts/fixtures/**'
      - 'pytest.ini'
      - 'dev/embody/unit_tests/test_embody_pyenv.py'
      - 'dev/embody/unit_tests/test_pyenv_context.py'
      - 'dev/embody/Embody/embody_pyenv.py'
      - 'dev/embody/Embody/embody_git.py'
      - 'dev/embody/Embody/EnvoyExt.py'
      - 'dev/embody/Embody/startup_progress.py'
      - 'dev/embody/Embody/wizard.tdn'
      - 'dev/embody/Embody/wizard/**'
      - 'dev/embody/unit_tests/conftest.py'
      - 'dev/embody/Embody/convoy/**'
      - 'dev/convoy/**'
      - 'pytest.ini'
      - '.github/workflows/bridge-tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The suite is ~2740 tests and takes ~8 minutes on a fast local box; the
    # macOS runner has come in at 15m18s against a 15-minute ceiling, i.e.
    # timing out rather than failing. Convoy keeps adding coverage, so give it
    # real headroom instead of re-tuning this every few releases.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # `cryptography` is the Convoy host app's ONE third-party
      # dependency, scoped to dev/convoy/convoy_hostkeys.py and pinned
      # there by an import-isolation test. It is installed here so the
      # identity suite RUNS -- including the spike test that re-proves,
      # on windows-latest AND macos-latest, that the bundled OpenSSL
      # negotiates mutual TLS 1.3 with an Ed25519 leaf certificate.
      #
      # A FLOOR, NOT A PIN, and no upper bound: an exact pin is what
      # broke fresh Envoy installs when the MCP SDK went 2.0, and the
      # host app degrades gracefully rather than crashing when the
      # package is absent, so CI tracking the current release is the
      # useful signal. 3.4 is the floor for the modern
      # load_pem_private_key / Ed25519 X.509 surface used here.
      # PyYAML is the SECOND dependency, and it is a test-only one: the
      # release-gate contract (test_convoy_parameter_contract.py) reads
      # Embody.tdn -- the tracked source every release .tox is built from --
      # to prove no hostname, address, host/convoy id or local path ships, and
      # that Convoy arrives disabled. That file is YAML. Without this the
      # module fails to IMPORT, which aborts collection for the whole run
      # rather than failing one test.
      - name: Install pytest and the host-identity dependency
        run: python -m pip install --quiet -r dev/embody/unit_tests/requirements-test.txt
      - name: Run the bridge suite
        run: python -m pytest -v
