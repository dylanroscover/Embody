; Pytest entry for the TD-import-free suites (A-51 test-runner story).
; Everything else under dev/embody/unit_tests runs ONLY inside
; TouchDesigner via TestRunnerExt -- pytest is pinned to the suites whose
; modules are pure Python, shimmed by dev/embody/unit_tests/conftest.py.
; dev/convoy joins them: the Convoy host app is stdlib-only and
; TD-import-free by design, so its whole suite belongs on the SAME
; windows+macos matrix -- that is what makes D-5's "the CI runner is the
; routine macOS signal, not the one physical Mac" true for Convoy code.
; test_convoy_client.py joins them for the same reason from the other
; side of the wire: Embody/convoy/convoy_client.py is the TD-side twin
; of dev/convoy/convoy_hostprobe.py, and its PARITY test is the only
; thing stopping those two copies from drifting -- so it has to run
; wherever the host app's suite runs.
; CI: .github/workflows/bridge-tests.yml (windows + macos matrix; the
; macos leg executes the darwin/pgrep paths the Windows dev box skips).
; ONE third-party dependency exists in that tree -- `cryptography`,
; required by dev/convoy/convoy_hostkeys.py (host identity) and by
; test_convoy_hostkeys.py, and by nothing else, which an
; import-isolation test enforces. The workflow installs it alongside
; pytest; without it the identity suite ERRORS at collection, while the
; host app ITSELF still starts and serves loopback (it degrades to "no
; identity" with a named reason), which is its own test.
[pytest]
; test_convoy_install.py joins them for the same reason as its sibling:
; Embody/convoy/convoy_install.py generates the Scheduled Task XML, the
; LaunchAgent plist and the launcher, and the macOS half of that is
; GENERATED-AND-UNIT-TESTED BUT NEVER RUN ON A MAC -- so the macos leg
; of this matrix is the only routine signal it gets at all.
; test_convoy_host_ladder.py drives ConvoyExt.py's module-level worker
; bodies -- the rung order that decides WHICH interpreter the daemon runs
; under. That decision writes a path into a machine-scoped installed.json
; and into the Windows Scheduled Task, and it had coverage on zero
; runners: its siblings live in test_convoy_host_install.py, which needs a
; live TouchDesigner session and is deliberately NOT listed here. The
; ladder needs no TD (ConvoyExt.py imports only the stdlib at module
; level, and worker bodies touch no TD object by contract), so the
; platform is passed in and both the win32 preference and the macOS
; ordering guard run on every leg of the matrix.
testpaths =
    dev/embody/unit_tests/test_envoy_bridge.py
    dev/embody/unit_tests/test_convoy_client.py
    dev/embody/unit_tests/test_convoy_install.py
    dev/embody/unit_tests/test_convoy_host_ladder.py
    dev/embody/unit_tests/test_startup_progress.py
    dev/embody/unit_tests/test_convoy_forget_ux.py
    dev/embody/unit_tests/test_convoy_realm_recovery.py
    dev/embody/unit_tests/test_wizard_convoy_contract.py
    dev/embody/unit_tests/test_convoy_parameter_contract.py
; test_worker_run_lint.py joins them because EnvoyExt's worker-run lint is
; a PURE ast pass over submitted source -- no TD object is involved, and the
; crash it exists to prevent (worker-side run(), Derivative-confirmed
; 2026-08-17) is silent on every platform, so the decision belongs on the
; whole matrix rather than only inside a live session.
    dev/embody/unit_tests/test_worker_run_lint.py
; test_thread_safety_guards.py: the sibling-API main-thread gate and the
; worker-log buffer are the runtime halves of the same advisory -- pure
; Python, with the in-TD `td` builtin stood in by a planted module global.
    dev/embody/unit_tests/test_thread_safety_guards.py
; test_project_saved_gate.py: the saved-vs-unsaved verdict every write
; gate and the Convoy enable path hang on. Pure Python (the `project`
; global is planted), and the bug it pins -- TD reporting the NEXT
; incremental name, so a saved project looks unsaved -- is silent and
; platform-independent.
    dev/embody/unit_tests/test_project_saved_gate.py
; test_embody_pyenv.py: the shared project venv module (embody_pyenv.py)
; is pure Python by contract -- extras steward, spec checks, link_env,
; tdPyEnvManager detection. The macos leg is the only routine signal the
; darwin branches (cryptography ceiling, arch migration) get.
    dev/embody/unit_tests/test_embody_pyenv.py
; test_pyenv_context.py: the TD pre-cook venv context authoring layer
; (render/classify/status in embody_pyenv.py + the gitignore-entry and
; manifest-unrecord helpers in embody_git.py) -- pure file ops, and the
; foreign-context hands-off contract is the node-pa-td outage guard.
    dev/embody/unit_tests/test_pyenv_context.py
    dev/convoy
addopts = -ra
