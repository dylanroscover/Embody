; Pytest entry for the TD-import-free suites (A-51 test-runner story).
; Everything else under dev/embody/unit_tests runs ONLY inside
; TouchDesigner via TestRunnerExt -- pytest is pinned to the suites whose
; modules are pure Python, shimmed by dev/embody/unit_tests/conftest.py.
; dev/convoy joins them: the Convoy host app is stdlib-only and
; TD-import-free by design, so its whole suite belongs on the SAME
; windows+macos matrix -- that is what makes D-5's "the CI runner is the
; routine macOS signal, not the one physical Mac" true for Convoy code.
; CI: .github/workflows/bridge-tests.yml (windows + macos matrix; the
; macos leg executes the darwin/pgrep paths the Windows dev box skips).
[pytest]
testpaths =
    dev/embody/unit_tests/test_envoy_bridge.py
    dev/convoy
addopts = -ra
